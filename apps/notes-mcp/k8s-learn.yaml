# 1) A folder for our things
apiVersion: v1
kind: Namespace
metadata:
  name: notes-learn
---
# 2) A storage space (like: docker run -v notes-data:/data)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes-data
  namespace: notes-learn
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
# 3) The order: always keep 1 copy of notes-mcp running
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-mcp
  namespace: notes-learn
spec:
  replicas: 1                      # how many copies
  selector:
    matchLabels:
      app: notes-mcp               # "the Pods with this sticker are mine"
  template:                        # what each Pod looks like:
    metadata:
      labels:
        app: notes-mcp             # put this sticker on every Pod
    spec:
      containers:
        - name: notes-mcp
          image: localhost:5000/urumi/notes-mcp:v1    # the image you pushed in Step 11
          ports:
            - containerPort: 3000
          env:
            - name: NOTES_FILE                         # like ENV in the Dockerfile
              value: /data/notes.json
          volumeMounts:
            - name: data
              mountPath: /data                         # plug the storage in at /data
          readinessProbe:                              # "is it ready?" -> asks /healthz
            httpGet:
              path: /healthz
              port: 3000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notes-data                      # use the storage from part 2
---
# 4) A fixed address that leads to the Pods with the sticker app=notes-mcp
apiVersion: v1
kind: Service
metadata:
  name: notes-mcp
  namespace: notes-learn
spec:
  selector:
    app: notes-mcp
  ports:
    - port: 3000
      targetPort: 3000
