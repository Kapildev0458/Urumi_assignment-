{{- if .Values.networkPolicy.enabled }}
# MariaDB: only WordPress and the setup job of this store may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "store.mariadbService" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "store.selectorLabels" (dict "ctx" . "component" "mariadb") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "store.selectorLabels" (dict "ctx" . "component" "wordpress") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "store.selectorLabels" (dict "ctx" . "component" "setup") | nindent 14 }}
      ports:
        - port: 3306
---
# WordPress: the ingress controller, the setup job, and explicitly allowed clients (the MCP server).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "store.wordpressService" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "store.selectorLabels" (dict "ctx" . "component" "wordpress") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        - podSelector:
            matchLabels:
              {{- include "store.selectorLabels" (dict "ctx" . "component" "setup") | nindent 14 }}
        {{- range .Values.networkPolicy.allowedClients }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - port: 80
{{- end }}
