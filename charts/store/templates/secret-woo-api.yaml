{{- /*
WooCommerce REST API key pair for the MCP server. Generated here (not inside WordPress) so it
lives in a Kubernetes Secret from the start; the setup job registers it in WooCommerce.
Kept separate from the store credentials so the MCP server never sees DB/admin passwords.
*/ -}}
{{- if not .Values.wooApi.existingSecret }}
{{- $name := include "store.wooApiSecret" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  consumer-key: {{ get $old "consumer-key" | default (printf "ck_%s" (randAlphaNum 64 | sha1sum) | b64enc) }}
  consumer-secret: {{ get $old "consumer-secret" | default (printf "cs_%s" (randAlphaNum 64 | sha1sum) | b64enc) }}
{{- end }}
