{{- /*
Random credentials generated on first install. `lookup` reuses the values already in the
cluster, so upgrades never rotate passwords out from under the running database.
*/ -}}
{{- if not .Values.credentials.existingSecret }}
{{- $name := include "store.credentialsSecret" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key := list "mariadb-root-password" "mariadb-password" "wp-admin-password" }}
  {{ $key }}: {{ get $old $key | default (randAlphaNum 24 | b64enc) }}
  {{- end }}
  {{- range $key := list "auth-key" "secure-auth-key" "logged-in-key" "nonce-key" "auth-salt" "secure-auth-salt" "logged-in-salt" "nonce-salt" }}
  {{ $key }}: {{ get $old $key | default (randAlphaNum 64 | b64enc) }}
  {{- end }}
{{- end }}
