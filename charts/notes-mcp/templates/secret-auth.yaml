{{- /*
Bearer token shared with the gateway. The gateway reads this Secret when it seeds the server
registry, so the token never appears in values files or the dashboard.
*/ -}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- $name := include "notes-mcp.authSecret" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "notes-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ get $old "token" | default (randAlphaNum 48 | b64enc) }}
{{- end }}
