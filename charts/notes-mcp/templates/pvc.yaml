apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "notes-mcp.fullname" . }}-data
  labels:
    {{- include "notes-mcp.labels" . | nindent 4 }}
  annotations:
    # Uninstalling the release must not delete the team's notes.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
