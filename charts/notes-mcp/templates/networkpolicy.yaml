{{- if .Values.networkPolicy.enabled }}
# Only the gateway may call the MCP server; everything else in (or outside) the cluster is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "notes-mcp.fullname" . }}
  labels:
    {{- include "notes-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "notes-mcp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedClients }}
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - port: 3000
{{- end }}
