apiVersion: v1
kind: Service
metadata:
  name: {{ include "notes-mcp.fullname" . }}
  labels:
    {{- include "notes-mcp.labels" . | nindent 4 }}
spec:
  # ClusterIP only and no Ingress: the server is never exposed outside the cluster.
  type: ClusterIP
  selector:
    {{- include "notes-mcp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notes-mcp.fullname" . }}
  labels:
    {{- include "notes-mcp.labels" . | nindent 4 }}
spec:
  # One writer for the JSON file: stop the old pod before starting the new one.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "notes-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notes-mcp.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notes-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NOTES_FILE
              value: /data/notes.json
            {{- if .Values.auth.enabled }}
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "notes-mcp.authSecret" . }}
                  key: token
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "notes-mcp.fullname" . }}-data
