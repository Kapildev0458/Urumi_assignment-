# Default values for the dashboard chart.

global:
  domain: 127.0.0.1.nip.io

nameOverride: ""
fullnameOverride: ""

image:
  repository: localhost:5000/urumi/dashboard
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicas: 1

# Same host as the gateway chart's Ingress (which serves /api and /mcp); this one serves "/".
ingress:
  enabled: true
  className: traefik
  host: ""
  hostPrefix: app
  annotations: {}
  tls:
    enabled: false
    secretName: ""

networkPolicy:
  enabled: true
  ingressControllerNamespace: kube-system

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 64Mi
