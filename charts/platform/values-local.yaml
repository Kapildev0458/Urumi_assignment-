# Local k3d cluster. Hosts resolve through nip.io wildcard DNS to 127.0.0.1 (see README).
global:
  domain: 127.0.0.1.nip.io

store:
  ingress:
    className: traefik
    tls:
      enabled: false
  wordpress:
    persistence:
      storageClass: local-path
      size: 2Gi
  mariadb:
    persistence:
      storageClass: local-path
      size: 2Gi

woo-mcp:
  image:
    # Built and pushed by scripts\build-images.ps1 to the k3d registry.
    repository: localhost:5000/urumi/woo-mcp

notes-mcp:
  image:
    repository: localhost:5000/urumi/notes-mcp
  persistence:
    storageClass: local-path

time-mcp:
  image:
    repository: localhost:5000/urumi/time-mcp

gateway:
  image:
    repository: localhost:5000/urumi/gateway
  admin:
    email: admin@urumi.local
  database:
    persistence:
      storageClass: local-path

dashboard:
  image:
    repository: localhost:5000/urumi/dashboard
