apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gateway.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
        {{- include "gateway.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: PUBLIC_URL
              value: {{ include "gateway.publicUrl" . | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.ingress.tls.enabled | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.secret" . }}
                  key: db-password
            - name: DATABASE_URL
              value: "postgres://gateway:$(DB_PASSWORD)@{{ include "gateway.dbService" . }}:5432/gateway"
            - name: CREDENTIALS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.secret" . }}
                  key: credentials-key
            - name: SEED_ADMIN_EMAIL
              value: {{ .Values.admin.email | quote }}
            - name: SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.secret" . }}
                  key: admin-password
            - name: UPSTREAM_LIST_TIMEOUT_MS
              value: {{ .Values.upstream.listTimeoutMs | quote }}
            - name: UPSTREAM_CALL_TIMEOUT_MS
              value: {{ .Values.upstream.callTimeoutMs | quote }}
            - name: UPSTREAM_REFRESH_INTERVAL_MS
              value: {{ .Values.upstream.refreshIntervalMs | quote }}
            {{- $seeds := list }}
            {{- range $i, $s := .Values.seedServers }}
            {{- $entry := dict "name" $s.name "url" ($s.url | default (printf "http://%s-%s/mcp" $.Release.Name $s.service)) }}
            {{- if $s.authSecret }}
            {{- $_ := set $entry "tokenEnv" (printf "SEED_TOKEN_%d" $i) }}
            - name: SEED_TOKEN_{{ $i }}
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-%s" $.Release.Name $s.authSecret }}
                  key: token
                  optional: true
            {{- end }}
            {{- $seeds = append $seeds $entry }}
            {{- end }}
            - name: SEED_SERVERS
              value: {{ $seeds | toJson | quote }}
            # Optional: without this Secret the chat agent reports "LLM not configured".
            {{- range $env, $key := dict "LLM_PROVIDER" "provider" "LLM_API_KEY" "api-key" "LLM_MODEL" "model" "LLM_BASE_URL" "base-url" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.llmSecret" $ }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ include "gateway.host" . }}
      secretName: {{ .Values.ingress.tls.secretName | default "app-tls" }}
  {{- end }}
  rules:
    - host: {{ include "gateway.host" . }}
      http:
        paths:
          {{- range list "/api" "/mcp" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "gateway.fullname" $ }}
                port:
                  name: http
          {{- end }}
{{- end }}
