{{- /*
Generated once and kept across upgrades (lookup): the credential encryption key, the first admin's
password and the database password. Nothing secret lives in values files or images.
*/ -}}
{{- $name := include "gateway.secret" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  annotations:
    # Losing credentials-key would make every stored upstream credential unreadable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  credentials-key: {{ get $old "credentials-key" | default (randAlphaNum 32 | b64enc | b64enc) }}
  admin-password: {{ get $old "admin-password" | default (randAlphaNum 20 | b64enc) }}
  db-password: {{ get $old "db-password" | default (randAlphaNum 32 | b64enc) }}
