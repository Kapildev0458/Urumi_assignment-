# PostgreSQL for users, API keys, the server registry and the audit log.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway.dbService" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.selectorLabels" (dict "ctx" . "component" "gateway-db") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "gateway.selectorLabels" (dict "ctx" . "component" "gateway-db") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gateway.dbService" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- include "gateway.selectorLabels" (dict "ctx" . "component" "gateway-db") | nindent 4 }}
spec:
  serviceName: {{ include "gateway.dbService" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" (dict "ctx" . "component" "gateway-db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
        {{- include "gateway.selectorLabels" (dict "ctx" . "component" "gateway-db") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      # uid 70 is the "postgres" user of the alpine image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: gateway
            - name: POSTGRES_DB
              value: gateway
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gateway.secret" . }}
                  key: db-password
            # A subdirectory, because the volume root contains lost+found on some storage.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "gateway", "-d", "gateway", "-h", "127.0.0.1"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gateway", "-d", "gateway", "-h", "127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "gateway", "-d", "gateway", "-h", "127.0.0.1"]
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.database.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.persistence.size }}
